<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0909" />
    <title>Play · Boxhead: Bounty Hunter</title>
    <link rel="icon" href="assets/site/favicon.png" type="image/png" />
    <link rel="preload" href="assets/site/Anton-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/play.css" />
    <link rel="preload" href="assets/site/loading-arena.webp" as="image" />
  </head>
  <body class="play-page">
    <!-- The steel shutters lifting, like leaving the homepage closed them. -->
    <div class="play-shutter" aria-hidden="true"><span></span><span></span></div>

    <header class="play-header">
      <a class="play-brand" href="index.html" aria-label="Boxhead Bounty Hunter homepage">
        <img src="assets/site/hunters-logo.png" alt="" width="542" height="296" />
        <span>BOXHEAD<small>BOUNTY HUNTER</small></span>
      </a>
      <nav class="play-nav" aria-label="Website">
        <a href="index.html">Home</a>
        <a href="index.html#about">About the game</a>
        <a href="index.html#whats-new">What's new</a>
        <a href="index.html#updates">Updates</a>
        <a href="index.html#feedback">Feedback &amp; bugs</a>
        <a href="index.html#support">Support a creator</a>
      </nav>
      <a class="play-back" href="index.html"><span aria-hidden="true">←</span> Back to site</a>
    </header>
    <div class="play-hazard" aria-hidden="true"></div>

    <main class="play-main">
      <div class="play-console">
        <div class="play-frame">
          <!-- The boxhead.com game frame: a silver window with the nameplate on top and the hunters peeking over it. -->
          <div class="play-plate" aria-hidden="true">
            <img class="play-peek" src="assets/site/hunters-logo.png" alt="" width="542" height="296" />
            <span>BOXHEAD</span>
          </div>
          <div class="play-stage" id="play-stage" tabindex="0" aria-label="Boxhead game console">
            <div id="game"></div>
            <div id="game-ui" hidden></div>
            <div id="flash-ui" hidden></div>
            <div id="overlay" hidden></div>
            <div id="map-loading" hidden aria-label="Loading game">
              <div class="map-loading-copy">
                <p role="status">Loading Map</p>
                <button type="button" aria-label="Cancel loading map">cancel</button>
              </div>
            </div>
          </div>
        </div>
        <div class="play-actions">
          <button class="play-fullscreen" type="button" id="play-fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
            <span>Fullscreen</span>
          </button>
        </div>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="vendor/phaser.min.js"></script>
    <script type="module" src="src/main.js"></script>
    <script src="src/play-page.js" defer></script>
  </body>
</html>
